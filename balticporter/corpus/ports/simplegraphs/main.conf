# -------------------------------------------------------------------------------------------
# simple-graphs — `src/main/java`, 29 types, a dependency-free graph library.
#
# This is the corpus's ACCEPTANCE PROOF for the config front door (DESIGN.md §5.7): the port that
# `just sg-measure` measures is driven from this file, and the lane's requirement is that every
# check count and every member digest is byte-identical to the hand-written Scala migration
# program it replaced. `SimpleGraphsMigrate` is now three lines that resolve this path and call
# `PortConfig.load`.
#
# Paths are relative to THIS FILE (see `balticporter.runner.PortConfig`), so the port directory is
# relocatable and no system property has to be set for it to resolve.
#
# WHY simple-graphs, and not libGDX, is the one converted: it is the port whose whole policy is
# data. libGDX and Ashley both pass Scala the config format deliberately cannot hold — a §1(c)
# rule and, in Ashley's case, method bodies keyed to a dropped type — and the honest way to run
# those from a conf is a factory each, in the porting repository. See DESIGN.md §5.7.
# -------------------------------------------------------------------------------------------

label = "sge-graphs"

input {
  # A BASE port: nothing is merely resolved against, everything is converted.
  sourceRoot = "../../../../../sge/original-src/simple-graphs/src/main/java"
}

output {
  portRoot  = "../../../../ported/sge-graphs"
  sourceSet = "main"
}

# simple-graphs' policy. A BASE manifest — it has no bases of its own.
manifest {
  name    = "sge-graphs"
  governs = ["space.earlygrey.simplegraphs"]

  # `packageRenames` is DATA rather than a surface entry (CLAUDE.md §4.56): the rename must run
  # after every other phase, because all of their policy is written in the upstream namespace, and
  # `runsAfter` cannot state "after everything". `PortRun` appends it last and verifies it with
  # `PackageRenameTransform.check`. Writing `{ transform = "package-rename" }` above is refused by
  # name, and the refusal says this.
  #
  # The reference hand-port's target namespace. This is the first time the engine renames a real
  # library, so treat a surprise here as information rather than noise.
  packageRenames { "space.earlygrey.simplegraphs" = "sge.graphs" }

  surface = [
    { transform = "collections" },
    { transform = "mutable-params" },
  ]
}

# Licence — a discrepancy worth recording. Upstream ships MIT (`LICENSE`: "MIT License, Copyright
# (c) 2020 earlygrey"). The reference hand-port's file headers say "Licensed under the ISC
# License". One of the two is wrong, and since a port is a derived work the upstream file is the
# authority — this port states MIT.
provenance {
  upstreamName     = "simple-graphs"
  originalLicense  = "MIT"
  sourcePathPrefix = "src/main/java"
  # `upstreamCommit` is omitted on purpose: derived from the vendored tree's own git state, which
  # is the only value that cannot go stale.
}

# A single source set compiled standalone by `scala-cli`: the support types the collections phase
# retypes onto ship beside the emitted code.
runtimeMode = "vendored"

nextStep = "scala-cli compile simplegraphs-core/src_managed/main/scala"
