# -------------------------------------------------------------------------------------------
# liqp — `src/main/java`, 135 types, a Java implementation of the Liquid templating engine
# backed by an ANTLR grammar (https://github.com/bkiers/Liqp).
#
# The FIRST corpus library from outside the gdx/sge family. What it is here to exercise is in
# `LiqpMigrate`'s doc; what it costs is in `PROGRESS.md` §liqp. Milestone 1 is the SKELETON and
# the measured WALL — this port is not expected to compile, and the first census is a number
# classified per CLAUDE.md §1, not an estimate.
#
# Paths are relative to THIS FILE (see `balticporter.runner.PortConfig`), so the port directory is
# relocatable and no system property has to be set for it to resolve. Note liqp's upstream is a
# submodule of **ssg**, not of sge like every other corpus library, so the `..` chain lands on a
# different sibling checkout.
# -------------------------------------------------------------------------------------------

label = "ssg-liquid"

input {
  # A BASE port: nothing is merely resolved against, everything is converted.
  sourceRoot = "../../../../../ssg/original-src/liqp/src/main/java"

  # DECISION D-liqp-10 — THIS PORT CLAIMS JACKSON'S ANNOTATIONS ON A TYPE.
  #
  # `LiquidSupport` is declared `@JsonSerialize(using = LiquidSupport.LiquidSerializer.class)`, and
  # that annotation is not decoration: jackson looks the serializer up ON THE INTERFACE, so without
  # it a `SuppPojo implements LiquidSupport` is BEAN-serialised, `toLiquid()` is never called, and
  # liqp's EAGER evaluate mode renders the pojo's own properties. Three tests
  # (`testLookupNode2c`, `testMapFilter2c`, `renderLiquidSupportWithNewRenderingSettings`) read
  # `childOK`/`not this` where java reads `SuppChild`/`OK`, at 0 compile errors, with the whole of
  # the evidence being one `omissions` row that read `1` on every run of this port
  # (`ENGINE-LIMITS.md` T16).
  #
  # It is POLICY and not an engine default for the reason the carrier and the sink above are: WHICH
  # annotations are behaviour-bearing is a fact about a library and its dependencies, never about
  # java. The corpus's other type-level drops are 11 `@SuppressWarnings`, 3 `@Target` on
  # `@interface` declarations and 1 `@RunWith` on a suite the test-framework phase converts to
  # MUnit — carrying those would emit a junit runner onto a munit suite for nobody. So the engine
  # claims none and this port names the one family it needs; the prefix cuts at a separator, so
  # `com.fasterxml.jackson.` covers `…databind.annotation.JsonSerialize` and nothing else.
  preservedAnnotations = ["com.fasterxml.jackson."]

  # The frontend's view of everything liqp does NOT declare: the six jars `pom.xml` lists at
  # compile scope, plus the ANTLR-generated parser compiled to class files.
  #
  # DECISION D-liqp-1 — THE GENERATED PARSER IS EXTERNAL IN THIS MILESTONE. liqp's sources
  # `import liquid.parser.v4.{LiquidLexer, LiquidParser, …}`: six files, 9 432 lines, generated
  # from `src/main/antlr4/**.g4` by the antlr4-maven-plugin into `target/generated-sources/antlr4`
  # and UNTRACKED — present in a built checkout, absent in a fresh one. They are NOT in
  # `sourceRoot`; the frontend resolves them by class file, the emitted Scala names them fully
  # qualified, and `just liqp-measure` puts the same directory on scalac's classpath. Porting the
  # generated parser through the engine is a recorded LATER milestone (a second module), never a
  # thing to decide by accident.
  #
  # DECISION D-liqp-1b — …AND IT IS COMPILED INTO THE NAMESPACE THIS PORT EMITS. D-liqp-1 and
  # D-liqp-2 cut each other: the generated `LiquidParser` has a member typed
  # `liqp.TemplateParser.ErrorMode`, and this port emits that type as `ssg.liquid.TemplateParser
  # .ErrorMode`, so three call sites hand the parser an argument of a type its class file does not
  # name. No manifest key closes that — none of them rewrites an ARGUMENT, and a `type-redirect` at
  # that enum would move the port's own type everywhere and make the emitted library depend on
  # upstream liqp bytecode.
  #
  # What settles it is that the generated parser is not a DEPENDENCY: it is a BUILD PRODUCT of this
  # port's own build step, regenerated from `src/main/antlr4/**` and untracked. So `LiqpClasspath`
  # copies the six generated files, rewrites their references INTO the ported library to the
  # emitted namespace, and javacs THAT. D-liqp-1 is unchanged — the parser is still external, still
  # resolved by class file, still a later milestone to port through the engine.
  #
  # Three things about the rewrite that are not incidental, all in `LiqpClasspath`:
  #
  #   * it cuts only at a `.` (CLAUDE.md §4.56). `liqp.TemplateParser` is rewritten; the parser's
  #     own package `liquid.parser.v4` is not, and neither is any identifier that merely CONTAINS
  #     the string — a prefix is not a structural fact about anything;
  #   * it rewrites the ENUM CONSTANT ACCESS too, and that half is invisible to a compile. The port
  #     emits a java enum as a Scala `sealed abstract class` plus `case object`s, whose static
  #     forwarders carry `valueOf`/`values` and NOT the constants, so `ErrorMode.LAX` compiles
  #     against any java enum and is a `NoSuchFieldError` at RUN time — §3's defect class exactly.
  #     `ErrorMode.valueOf("LAX")` reaches the forwarder and returns the same singleton, so `==`
  #     still holds;
  #   * javac resolves the rewritten names against a SHAPE-HONEST stub (`javac-stub/`), read as a
  #     `-sourcepath` under `-implicit:none` so it is never written into the output. It declares no
  #     constants, so a form the runtime could not link is a javac error here; and upstream `liqp`
  #     is on no classpath of that step at all, so a reference the rewrite missed cannot resolve.
  #
  # The `out/liqp-upstream-classes` directory this port used to build — upstream liqp compiled
  # beside the parser, for scalac only, because scalac reading `liqp.TemplateParser$ErrorMode`
  # without it ABORTS instead of reporting — is GONE. There is no seam left for it to soften.
  #
  # The file is written by `LiqpClasspath`, which also runs the rewrite and the javac step, so the
  # frontend has ONE input to read. A declared classpath file that is not there is fatal
  # (`PortConfig`), and a missing generated tree is fatal with the regeneration command
  # (`LiqpClasspath`): an unresolvable import does not fail the frontend, it resolves WRONGLY, and
  # the port then emits nonsense and reports success (CLAUDE.md §5.1).
  classpathFile = "../../../../out/liqp-classpath.txt"
}

output {
  portRoot  = "../../../../ported/ssg-liquid"
  sourceSet = "main"
}

# liqp's policy. A BASE manifest — it has no bases of its own.
manifest {
  name    = "ssg-liquid"
  governs = ["liqp"]

  # DECISION D-liqp-2 — the reference hand-port's namespace (`../ssg/ssg-liquid`, `package
  # ssg.liquid`), the same convention simple-graphs follows to `sge.graphs`. ssg cannot adopt
  # output in the upstream namespace, so this is real policy rather than an exercise.
  #
  # `packageRenames` is DATA rather than a surface entry (CLAUDE.md §4.56): the rename must run
  # after every other phase, because all of their policy is written in the upstream namespace, and
  # `runsAfter` cannot state "after everything". `PortRun` appends it last and verifies it with
  # `PackageRenameTransform.check`.
  #
  # The generated parser's package `liquid.parser.v4` is deliberately NOT renamed: it is external
  # in this milestone (D-liqp-1 above), so its class files keep the name they were compiled under.
  # What the rename DOES reach is the ANTLR output's one member typed `liqp.TemplateParser
  # .ErrorMode` — the seam D-liqp-1b answers, by rewriting the generated sources into this map's
  # right-hand side before javac reads them. The map here is the one statement of that namespace;
  # `LiqpClasspath` restates it in Scala and nothing compares the two, so a change is a change in
  # both places.
  packageRenames { liqp = "ssg.liquid" }

  # The starting policy, and deliberately the same two phases simple-graphs starts from: milestone
  # 1 measures a WALL, and a wall measured under invented policy says nothing about the engine.
  # Every adjustment after this one arrives with the number that justified it.
  # DECISION D-liqp-8 — jackson's `TypeReference` is a REIFIED CARRIER (`ENGINE-LIMITS.md` K20).
  #
  # `LiquidSupport.LiquidSupportFromInspectable.MAP_TYPE_REF` is a super-type token: its type
  # argument survives erasure into the class file's generic signature and jackson READS IT BACK at
  # `convertValue(value, MAP_TYPE_REF)` and constructs from it. Retyped along with every honest slot
  # the port asks jackson for `scala.collection.mutable.Map`, which has no creators — 10 test
  # failures, 0 compile errors, every check count flat. The argument therefore stays java's and the
  # value is bridged where it is used.
  #
  # It is POLICY and not an engine table because a carrier is a fact about THIS library's
  # dependencies: liqp uses jackson, so `TypeReference` is its carrier, and a library on gson or
  # guice would write `TypeToken` or `Key` here. `java.lang.Class` is the one java itself
  # guarantees and the engine carries it, so `Map.class`/`HashMap.class` need no entry.
  # D-liqp-9: THE SAME THIRD PARTY AT THE OTHER END OF THE SAME CALL — `ENGINE-LIMITS.md` K21
  # face 1. A carrier is jackson reading the class file's TYPE ARGUMENTS; `ObjectMapper` also reads
  # the OBJECT, at a `java.lang.Object` formal that takes anything. So the port compiles, every
  # check reads flat, and `writeValueAsString(aMap)` emits
  # `{"scala$collection$mutable$HashMap$$table":[…]}` where java emitted the map's entries — with
  # the `table` array (a `java.util.ArrayList`) then failing a cast three hops away in the `where`
  # filter. Naming the owner here bridges every such argument through
  # `JavaCollections.Reified.toJavaValue`, which decides at RUN TIME because there is nothing to
  # decide from at the call: liqp's whole data model is `Object`, holding java's values and the
  # port's at the same slot.
  #
  # Seven sites, all in `Json.apply`, `Template.putStringKey`, `LiquidWhereImpl` and
  # `LiquidSupport.objectToMap`. It is POLICY for the reason the carrier above is, one step
  # stronger: java guarantees no reflective sink at all, so the engine ships an empty list and the
  # `OpaqueEgress` boundary rows are where a port reads the candidates off.
  # DECISION D-liqp-11 — THE SPI DESCRIPTOR IS PART OF THE DELIVERABLE, AND BOTH ITS NAMESPACES MOVE.
  #
  # `SPIHelper.findProviders()` does `ServiceLoader.load(TypesSupport.class)`, reached from
  # `Template`'s `static { }` block — i.e. effectively from the whole suite — and from
  # `LiquidSupport`'s type-referencing setup, i.e. from every render of a POJO. The provider list
  # lives in `src/main/resources/META-INF/services/liqp.spi.TypesSupport`, which no phase could
  # carry: the engine emitted `.scala` and nothing else, and with the resource absent the loader
  # finds ZERO providers, `applyCustomDateTypes()` becomes a no-op, and there is no compile error, no
  # check count and no finding (`ENGINE-LIMITS.md` P5).
  #
  # This key is the mechanism; what is per-library is only WHICH file. Both namespaces move (§4.56):
  # the FILE NAME is the renamed interface FQN (`ssg.liquid.spi.TypesSupport`) and the two LINES are
  # renamed provider FQNs, translated through this port's own `packageRenames` above by the run's own
  # rename phase — so changing D-liqp-2 cannot leave the descriptor stale. It replaces the
  # hand-written `ported/ssg-liquid/src/main/resources/…` file this port used to ship, which was the
  # one hand-written file of this port and had to be kept in step with the rename by hand.
  serviceProviders = [
    "../../../../../ssg/original-src/liqp/src/main/resources/META-INF/services/liqp.spi.TypesSupport",
  ]

  # DECISION D-liqp-12 — `ServiceLoader` IS REDIRECTED AT A CROSS-PLATFORM WRAPPER (`DESIGN.md`
  # §8.19), which is what discharges the refusal this entry used to record.
  #
  # `SPIHelper.findProviders()` is `ServiceLoader.load(TypesSupport.class)` followed by
  # `loader.iterator()`, and it is the site D-liqp-11 above exists for: this port SHIPS the
  # descriptor that lookup reads. Reading the site, the obvious reaction is "yes, this is JVM-only,
  # stop reporting it" — which is what the menu's `accept-jvm-only` said, and it was REFUSED here
  # with the `targets-contradiction` guard: this manifest declares no `targets`, so it claims all
  # three, and a module cannot be built for a backend and accept an API that backend does not have.
  #
  # That refusal was CORRECT and it is now obsolete, so the entry is GONE rather than kept as a
  # commentary. A `resolutions` key that binds to a real declaration, names a live remedy and can
  # never fire is an inert selection, which `PolicyIssue.NeverApplied` reports as a `policy` finding
  # — the port would be claiming to have read a site whose finding no longer exists.
  #
  # WHAT REPLACES IT is two surface entries below and one `dependencies` line, and NO new engine
  # phase: `java.util.ServiceLoader` is both a FACTORY and a HANDLE in java, and the wrapper splits
  # them the way scala does (`PlatformServiceLoader.load` returns a `ServiceProviders[T]`), so the
  # TYPE occurrences and the STATIC CALL need two different targets and the engine already has one
  # keyed seam for each.
  surface = [
    # THE TWO CALLS, AND WHY THEY RUN FIRST. `Pipeline.order` is stable in the order this list
    # declares, and both entries below are ordered against a phase rather than by taste:
    #
    #   * BEFORE `type-redirect`, because that phase mints a static TWIN owned by its target for
    #     every static of the redirected type — after which `load`'s callee symbol occurs nowhere and
    #     this key matches nothing, silently, which is the `NeverMatched` case that phase's own
    #     finding warns about;
    #   * BEFORE `collections`, because that phase COERCES at an external callee whose return type is
    #     a JDK collection, and `iterator()` is exactly that. Left to fire it emits
    #     `JavaCollections.fromJava(loader.iterator())` against a receiver that is no longer a
    #     `java.util.ServiceLoader` — measured, 0 -> 1 errors, `E134` with no overload of `fromJava`
    #     taking a `scala.collection.Iterator`. Substituted first there is no callee left to coerce.
    #
    # THE FACTORY. `ServiceLoader.load(Class)` is a static whose RESULT is the handle, and the
    # wrapper puts the factory on a different object than the handle — the split scala makes and java
    # does not — so this is a call rewrite and not a member of the redirect below. The key is PRECISE
    # because the JDK overloads `load` three ways (`load(Class)`, `load(Class,ClassLoader)`,
    # `load(ModuleLayer,Class)`) and a positional template can only be right for one arity.
    #
    # THE ITERATOR, which is the ONE SEAM the redirect creates and the reason it is bridged here
    # rather than assumed away. `ServiceProviders#iterator()` carries java's own ARITY (§4.5 is why
    # the wrapper was written that way) and NOT java's element type: it answers a
    # `scala.collection.Iterator` where `java.util.ServiceLoader#iterator()` answered a
    # `java.util.Iterator`, which this port retypes to `balticporter.runtime.JavaIterator`. Those are
    # two different types and the seam is a typer error rather than anything silent, which is what
    # makes a one-line bridge the whole answer: `JavaIterator.from` takes exactly the scala iterator
    # the wrapper hands back.
    { transform = "call-site-substitution"
      calls {
        "java.util.ServiceLoader#load(Class)" = "multiarch.serviceloader.PlatformServiceLoader.load({arg0})"
        "java.util.ServiceLoader#iterator()"  = "balticporter.runtime.JavaIterator.from({recv}.iterator())"
      } },

    { transform = "collections"
      reifiedCarriers = ["com.fasterxml.jackson.core.type.TypeReference"]
      reflectiveSinks = ["com.fasterxml.jackson.databind.ObjectMapper",
                         "com.fasterxml.jackson.core.JsonGenerator"] },
    { transform = "mutable-params" },

    # THE HANDLE. Every remaining occurrence of the type — the local's declared type here, and any
    # field, cast or type argument a library writes — becomes the wrapper's handle.
    #
    # WHAT MAKES THIS FAITHFUL IS THE SHAPE OF THE TARGET, not a guard and not a count.
    # `ServiceProviders` declares `iterator()` and `toList` and NOTHING ELSE: no `stream()`, no
    # `reload()`, no `Provider`, and it is not an `Iterable`. So every way this redirect could be
    # wrong AT A TYPE is a SLOT WHOSE TWO SIDES DISAGREE — a member java's `ServiceLoader` has and the
    # wrapper does not simply fails to resolve, and the one member both spell is the seam bridged
    # above. For the TYPES the compiler is the instrument, in this lane and in any consumer's.
    #
    # …AND THAT IS NOT THE WHOLE DELTA, which this comment used to claim. What `load` FINDS is a
    # different question with no slot in it: java's trigger is the CLASSPATH SCAN `load` performs, so
    # shipping the descriptor (D-liqp-11 above) is everything the JVM needs, while Scala.js and Scala
    # Native have no scan and resolve by REGISTRATION — which lives in a generated object body that
    # neither this port's emitted Scala nor its generated build ever touches. This manifest declares
    # no `targets`, so it claims all three, and on a future JS or Native build `findProviders()` would
    # answer an EMPTY iterator with no compile error and no other count: `ENGINE-LIMITS.md` P5's own
    # defect one platform over. It is COUNTED and not closed — one `off-jvm-unwired` row per
    # descriptor on the `service-providers` lane, and `ENGINE-LIMITS.md` P9 for what building the
    # trigger would take. Narrowing `targets` to `[jvm]` would remove the row and is deliberately NOT
    # done: sge and ssg target every platform wherever possible (CLAUDE.md §1.5), and this port is
    # otherwise portable.
    { transform = "type-redirect"
      redirects { "java.util.ServiceLoader" = "multiarch.serviceloader.ServiceProviders" } },
  ]

  # D-liqp-10: THE ONE EXTERNAL CALLEE THIS PORT CAN ANSWER FOR — `DESIGN.md` §8.16.
  #
  # `ExternalCallee` counts a slot whose other side is a compiled class file: the frontend interned
  # `Objects.requireNonNull` with NO signature, so the check has no formal to compare and says so —
  # "Required unknown". That is a CANNOT-VERIFY count and not a defect, which is exactly the shape a
  # per-location remedy exists for: the engine cannot read the class file, and a reader can read the
  # SPECIFICATION. `requireNonNull` throws NPE for a null reference and otherwise RETURNS THE SAME
  # REFERENCE — it neither inspects nor converts what it is handed. So both halves of every row it
  # produces are answered by the method's own contract: nothing crosses at the argument, and the
  # "unverified pass-through" result is the very value that went in, which is this port's own
  # retyped collection.
  #
  # BARE because it is EXACT: every call liqp makes is the one-argument overload, and a bare key
  # names the whole set. It used to be bare because it had to be — an external callee's row prints
  # `Symbol.fullName`, which the frontend interns with FULLY QUALIFIED parameters, while a
  # `Descriptor` is SIMPLE names, so a precise key copied out of the report matched NOTHING. The
  # binder compares descriptors through `Descriptor.matches` now (simple names on both sides), so
  # either spelling binds and this is a choice rather than a workaround.
  #
  # It is the ONLY entry: the other rows in this lane are a `HashMap` handed to an external
  # constructor and to jackson's `readValue`, and neither of those is a method whose contract says
  # it leaves the value alone.
  resolutions { "java.util.Objects#requireNonNull" = "accept-external-callee" }

  # DECISION D-liqp-13 — THE ARTIFACTS THIS MODULE'S BUILD ADDS, which is what a `Verdict.Depend`
  # is answered WITH (CLAUDE.md §1.5, `ENGINE-LIMITS.md` P6).
  #
  # This manifest declares no `targets`, so it claims all three, and 101 sites of this port's own
  # emitted code call an API that EXISTS off the JVM in an artifact nobody had named: 99 of them
  # `java.time.*` (`ZonedDateTime`, `ZoneId`, `Instant`, the whole `temporal` and `format`
  # families) and 2 `java.text.DecimalFormat`, plus `java.util.Locale`. `dependency-coverage`
  # reported every one of them on every run of this port since the lane existed, and the reader's
  # action was never to remove a call — it was this key.
  #
  # TWO entries and not three: `scala-java-time-tzdb` is what `ZoneId.of(String)` needs (the whole
  # IANA database, `JS-L63`), and this source set never calls it — the SUITE does, and declares it
  # itself. An entry naming an artifact no requirement here wants is a `policy` finding of its own
  # now, which is what keeps this list honest in the other direction.
  #
  # `cross = "platform"` because that is what these artifacts ARE: `scala-java-time_sjs1_3` and
  # `scala-java-time_native0.5_3` are published beside `scala-java-time_3`, so `%%` would ask a JS
  # build for the JVM jar. The versions are the catalog's surveyed ones; the check matches on
  # organisation and NAME and never on the revision, so pinning another one is this port's business.
  # THREE entries since D-liqp-12: `multiarch-serviceloader` is what `java.util.ServiceLoader`'s row
  # now answers with on both non-JVM backends, and it is the artifact the two surface entries above
  # redirect INTO — so the declaration and the redirect are one decision written in the two places
  # that can act on it. It is the corpus's first coordinate needing a `resolver`: multiarch-scala
  # publishes to the Central Portal SNAPSHOT repository and to no release repository, so a build
  # naming the coordinate alone resolves nothing. The revision is provisional until that repository's
  # next release, which the catalog row says at the coordinate it recommends.
  dependencies = [
    { org = "io.github.cquiroz", name = "scala-java-time",    rev = "2.6.0", cross = "platform" },
    { org = "io.github.cquiroz", name = "scala-java-locales", rev = "1.5.4", cross = "platform" },
    { org = "com.kubuszok",      name = "multiarch-serviceloader", rev = "0.4.0-12-gc168b2f-SNAPSHOT",
      cross = "platform", resolver = "https://central.sonatype.com/repository/maven-snapshots" },
  ]
}

# `LICENSE`: "MIT License, Copyright (c) 2010-2013 by Bart Kiers"; `NOTICE` names the project and
# the same holder. A port is a derived work, so every emitted file carries the banner — and this
# library is the corpus's first where the banner is NOT enough (CLAUDE.md §4.57). liqp carries ZERO
# per-file headers, so those two files are the only home of the copyright and permission notice,
# and MIT's one condition is that the notice be INCLUDED in copies. `notices` copies them beside the
# emitted code (`liqp-core/src_managed/`), which is where this port's derived work lives.
provenance {
  upstreamName     = "liqp"
  originalLicense  = "MIT"
  sourcePathPrefix = "src/main/java"
  # `upstreamCommit` is omitted on purpose: derived from the vendored tree's own git state, which
  # is the only value that cannot go stale. Note liqp is a git SUBMODULE of ssg, so that state is
  # the submodule's.
  #
  # Relative to THIS FILE, like every other path here — the upstream ROOT, four directories above
  # the source root this port parses. A declared file that is not there is fatal.
  notices = [
    "../../../../../ssg/original-src/liqp/LICENSE",
    "../../../../../ssg/original-src/liqp/NOTICE",
  ]
}

# A single source set compiled standalone by `scala-cli`: the support types the collections phase
# retypes onto ship beside the emitted code. Same reason as simple-graphs — there is no second
# module of this port yet to carry them.
runtimeMode = "vendored"

nextStep = "just liqp-measure"
