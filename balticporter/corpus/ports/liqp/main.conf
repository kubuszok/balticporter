# -------------------------------------------------------------------------------------------
# liqp — `src/main/java`, 135 types, a Java implementation of the Liquid templating engine
# backed by an ANTLR grammar (https://github.com/bkiers/Liqp).
#
# The FIRST corpus library from outside the gdx/sge family. What it is here to exercise is in
# `LiqpMigrate`'s doc; what it costs is in `PROGRESS.md` §liqp. Milestone 1 is the SKELETON and
# the measured WALL — this port is not expected to compile, and the first census is a number
# classified per CLAUDE.md §1, not an estimate.
#
# Paths are relative to THIS FILE (see `balticporter.runner.PortConfig`), so the port directory is
# relocatable and no system property has to be set for it to resolve. Note liqp's upstream is a
# submodule of **ssg**, not of sge like every other corpus library, so the `..` chain lands on a
# different sibling checkout.
# -------------------------------------------------------------------------------------------

label = "ssg-liquid"

input {
  # A BASE port: nothing is merely resolved against, everything is converted.
  sourceRoot = "../../../../../ssg/original-src/liqp/src/main/java"

  # DECISION D-liqp-10 — THIS PORT CLAIMS JACKSON'S ANNOTATIONS ON A TYPE.
  #
  # `LiquidSupport` is declared `@JsonSerialize(using = LiquidSupport.LiquidSerializer.class)`, and
  # that annotation is not decoration: jackson looks the serializer up ON THE INTERFACE, so without
  # it a `SuppPojo implements LiquidSupport` is BEAN-serialised, `toLiquid()` is never called, and
  # liqp's EAGER evaluate mode renders the pojo's own properties. Three tests
  # (`testLookupNode2c`, `testMapFilter2c`, `renderLiquidSupportWithNewRenderingSettings`) read
  # `childOK`/`not this` where java reads `SuppChild`/`OK`, at 0 compile errors, with the whole of
  # the evidence being one `omissions` row that read `1` on every run of this port
  # (`ENGINE-LIMITS.md` T16).
  #
  # It is POLICY and not an engine default for the reason the carrier and the sink above are: WHICH
  # annotations are behaviour-bearing is a fact about a library and its dependencies, never about
  # java. The corpus's other type-level drops are 11 `@SuppressWarnings`, 3 `@Target` on
  # `@interface` declarations and 1 `@RunWith` on a suite the test-framework phase converts to
  # MUnit — carrying those would emit a junit runner onto a munit suite for nobody. So the engine
  # claims none and this port names the one family it needs; the prefix cuts at a separator, so
  # `com.fasterxml.jackson.` covers `…databind.annotation.JsonSerialize` and nothing else.
  preservedAnnotations = ["com.fasterxml.jackson."]

  # The frontend's view of everything liqp does NOT declare: the six jars `pom.xml` lists at
  # compile scope, plus the ANTLR-generated parser compiled to class files.
  #
  # DECISION D-liqp-1 — THE GENERATED PARSER IS EXTERNAL IN THIS MILESTONE. liqp's sources
  # `import liquid.parser.v4.{LiquidLexer, LiquidParser, …}`: six files, 9 432 lines, generated
  # from `src/main/antlr4/**.g4` by the antlr4-maven-plugin into `target/generated-sources/antlr4`
  # and UNTRACKED — present in a built checkout, absent in a fresh one. They are NOT in
  # `sourceRoot`; the frontend resolves them by class file, the emitted Scala names them fully
  # qualified, and `just liqp-measure` puts the same directory on scalac's classpath. Porting the
  # generated parser through the engine is a recorded LATER milestone (a second module), never a
  # thing to decide by accident.
  #
  # DECISION D-liqp-1b — …AND IT IS COMPILED INTO THE NAMESPACE THIS PORT EMITS. D-liqp-1 and
  # D-liqp-2 cut each other: the generated `LiquidParser` has a member typed
  # `liqp.TemplateParser.ErrorMode`, and this port emits that type as `ssg.liquid.TemplateParser
  # .ErrorMode`, so three call sites hand the parser an argument of a type its class file does not
  # name. No manifest key closes that — none of them rewrites an ARGUMENT, and a `type-redirect` at
  # that enum would move the port's own type everywhere and make the emitted library depend on
  # upstream liqp bytecode.
  #
  # What settles it is that the generated parser is not a DEPENDENCY: it is a BUILD PRODUCT of this
  # port's own build step, regenerated from `src/main/antlr4/**` and untracked. So `LiqpClasspath`
  # copies the six generated files, rewrites their references INTO the ported library to the
  # emitted namespace, and javacs THAT. D-liqp-1 is unchanged — the parser is still external, still
  # resolved by class file, still a later milestone to port through the engine.
  #
  # Three things about the rewrite that are not incidental, all in `LiqpClasspath`:
  #
  #   * it cuts only at a `.` (CLAUDE.md §4.56). `liqp.TemplateParser` is rewritten; the parser's
  #     own package `liquid.parser.v4` is not, and neither is any identifier that merely CONTAINS
  #     the string — a prefix is not a structural fact about anything;
  #   * it rewrites the ENUM CONSTANT ACCESS too, and that half is invisible to a compile. The port
  #     emits a java enum as a Scala `sealed abstract class` plus `case object`s, whose static
  #     forwarders carry `valueOf`/`values` and NOT the constants, so `ErrorMode.LAX` compiles
  #     against any java enum and is a `NoSuchFieldError` at RUN time — §3's defect class exactly.
  #     `ErrorMode.valueOf("LAX")` reaches the forwarder and returns the same singleton, so `==`
  #     still holds;
  #   * javac resolves the rewritten names against a SHAPE-HONEST stub (`javac-stub/`), read as a
  #     `-sourcepath` under `-implicit:none` so it is never written into the output. It declares no
  #     constants, so a form the runtime could not link is a javac error here; and upstream `liqp`
  #     is on no classpath of that step at all, so a reference the rewrite missed cannot resolve.
  #
  # The `out/liqp-upstream-classes` directory this port used to build — upstream liqp compiled
  # beside the parser, for scalac only, because scalac reading `liqp.TemplateParser$ErrorMode`
  # without it ABORTS instead of reporting — is GONE. There is no seam left for it to soften.
  #
  # The file is written by `LiqpClasspath`, which also runs the rewrite and the javac step, so the
  # frontend has ONE input to read. A declared classpath file that is not there is fatal
  # (`PortConfig`), and a missing generated tree is fatal with the regeneration command
  # (`LiqpClasspath`): an unresolvable import does not fail the frontend, it resolves WRONGLY, and
  # the port then emits nonsense and reports success (CLAUDE.md §5.1).
  classpathFile = "../../../../out/liqp-classpath.txt"
}

output {
  portRoot  = "../../../../ported/ssg-liquid"
  sourceSet = "main"
}

# liqp's policy. A BASE manifest — it has no bases of its own.
manifest {
  name    = "ssg-liquid"
  governs = ["liqp"]

  # DECISION D-liqp-2 — the reference hand-port's namespace (`../ssg/ssg-liquid`, `package
  # ssg.liquid`), the same convention simple-graphs follows to `sge.graphs`. ssg cannot adopt
  # output in the upstream namespace, so this is real policy rather than an exercise.
  #
  # `packageRenames` is DATA rather than a surface entry (CLAUDE.md §4.56): the rename must run
  # after every other phase, because all of their policy is written in the upstream namespace, and
  # `runsAfter` cannot state "after everything". `PortRun` appends it last and verifies it with
  # `PackageRenameTransform.check`.
  #
  # The generated parser's package `liquid.parser.v4` is deliberately NOT renamed: it is external
  # in this milestone (D-liqp-1 above), so its class files keep the name they were compiled under.
  # What the rename DOES reach is the ANTLR output's one member typed `liqp.TemplateParser
  # .ErrorMode` — the seam D-liqp-1b answers, by rewriting the generated sources into this map's
  # right-hand side before javac reads them. The map here is the one statement of that namespace;
  # `LiqpClasspath` restates it in Scala and nothing compares the two, so a change is a change in
  # both places.
  packageRenames { liqp = "ssg.liquid" }

  # The starting policy, and deliberately the same two phases simple-graphs starts from: milestone
  # 1 measures a WALL, and a wall measured under invented policy says nothing about the engine.
  # Every adjustment after this one arrives with the number that justified it.
  # DECISION D-liqp-8 — jackson's `TypeReference` is a REIFIED CARRIER (`ENGINE-LIMITS.md` K20).
  #
  # `LiquidSupport.LiquidSupportFromInspectable.MAP_TYPE_REF` is a super-type token: its type
  # argument survives erasure into the class file's generic signature and jackson READS IT BACK at
  # `convertValue(value, MAP_TYPE_REF)` and constructs from it. Retyped along with every honest slot
  # the port asks jackson for `scala.collection.mutable.Map`, which has no creators — 10 test
  # failures, 0 compile errors, every check count flat. The argument therefore stays java's and the
  # value is bridged where it is used.
  #
  # It is POLICY and not an engine table because a carrier is a fact about THIS library's
  # dependencies: liqp uses jackson, so `TypeReference` is its carrier, and a library on gson or
  # guice would write `TypeToken` or `Key` here. `java.lang.Class` is the one java itself
  # guarantees and the engine carries it, so `Map.class`/`HashMap.class` need no entry.
  # D-liqp-9: THE SAME THIRD PARTY AT THE OTHER END OF THE SAME CALL — `ENGINE-LIMITS.md` K21
  # face 1. A carrier is jackson reading the class file's TYPE ARGUMENTS; `ObjectMapper` also reads
  # the OBJECT, at a `java.lang.Object` formal that takes anything. So the port compiles, every
  # check reads flat, and `writeValueAsString(aMap)` emits
  # `{"scala$collection$mutable$HashMap$$table":[…]}` where java emitted the map's entries — with
  # the `table` array (a `java.util.ArrayList`) then failing a cast three hops away in the `where`
  # filter. Naming the owner here bridges every such argument through
  # `JavaCollections.Reified.toJavaValue`, which decides at RUN TIME because there is nothing to
  # decide from at the call: liqp's whole data model is `Object`, holding java's values and the
  # port's at the same slot.
  #
  # Seven sites, all in `Json.apply`, `Template.putStringKey`, `LiquidWhereImpl` and
  # `LiquidSupport.objectToMap`. It is POLICY for the reason the carrier above is, one step
  # stronger: java guarantees no reflective sink at all, so the engine ships an empty list and the
  # `OpaqueEgress` boundary rows are where a port reads the candidates off.
  surface = [
    { transform = "collections"
      reifiedCarriers = ["com.fasterxml.jackson.core.type.TypeReference"]
      reflectiveSinks = ["com.fasterxml.jackson.databind.ObjectMapper",
                         "com.fasterxml.jackson.core.JsonGenerator"] },
    { transform = "mutable-params" },
  ]
}

# `LICENSE`: "MIT License, Copyright (c) 2010-2013 by Bart Kiers"; `NOTICE` names the project and
# the same holder. A port is a derived work, so every emitted file carries the banner — and this
# library is the corpus's first where the banner is NOT enough (CLAUDE.md §4.57). liqp carries ZERO
# per-file headers, so those two files are the only home of the copyright and permission notice,
# and MIT's one condition is that the notice be INCLUDED in copies. `notices` copies them beside the
# emitted code (`liqp-core/src_managed/`), which is where this port's derived work lives.
provenance {
  upstreamName     = "liqp"
  originalLicense  = "MIT"
  sourcePathPrefix = "src/main/java"
  # `upstreamCommit` is omitted on purpose: derived from the vendored tree's own git state, which
  # is the only value that cannot go stale. Note liqp is a git SUBMODULE of ssg, so that state is
  # the submodule's.
  #
  # Relative to THIS FILE, like every other path here — the upstream ROOT, four directories above
  # the source root this port parses. A declared file that is not there is fatal.
  notices = [
    "../../../../../ssg/original-src/liqp/LICENSE",
    "../../../../../ssg/original-src/liqp/NOTICE",
  ]
}

# A single source set compiled standalone by `scala-cli`: the support types the collections phase
# retypes onto ship beside the emitted code. Same reason as simple-graphs — there is no second
# module of this port yet to carry them.
runtimeMode = "vendored"

nextStep = "just liqp-measure"
