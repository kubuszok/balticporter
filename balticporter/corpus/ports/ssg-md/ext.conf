# -------------------------------------------------------------------------------------------
# ssg-md's EXTENSION half — MILESTONE 2, as ONE dependent port of `main.conf`.
#
# flexmark ships 29 covered `flexmark-ext-*` maven modules (386 java files) on top of the twelve
# milestone 1 converts. Every one of them declares under `com.vladsch.flexmark.ext.*`, resolves
# against the base's JAVA and against nothing else, and lands in the reference hand port's ONE
# `ssg-md` module at `ssg.md.ext.*` — `../ssg/ssg-md/src/main/scala/ssg/md/ext/` holds twenty-five
# such packages side by side. So this is not 29 modules; it is one module's other half.
#
# ==DECISION D-mde-1 — WHY ONE PORT AND NOT TWENTY-NINE==
#
# The emission identity of a run is the PAIR (`portRoot`, `sourceSet`), and `PortRun` opens its
# emission with an unconditional `wipe(emitDir)`: a second run at the same pair does not merge with
# the first, it DELETES it. `SourceSet` is `main | test` and nothing else, so `ported/ssg-md` has
# exactly two emission slots and `main.conf`/`test.conf` hold both.
#
# Three shapes were available and two of them are wrong:
#
#   * 29 confs at 29 port roots (`ported/ssg-md-ext-tables`, …). Twenty-nine baselines, twenty-nine
#     report identities and twenty-nine `measure-all` lanes for a destination that is ONE sbt module
#     — and CLAUDE.md §2.1 is explicit that a port is named for its destination, so twenty-nine
#     names for modules `../ssg/build.sbt` does not have is exactly the "two different answers to
#     one question" that rule exists to refuse;
#   * widening `main.conf`'s `includeGlobs` to 872 files. That is not a dependent port at all: it
#     abolishes the §1.5 relationship this milestone exists to exercise, and it moves the census
#     `PROGRESS.md` §10.6.3 quotes;
#   * ONE dependent port whose scope is the extension modules, at its own port root. That is this
#     file. Milestone 2's waves ADD `includeGlobs` lines; nothing else about the port moves, the
#     report identity (`FlexmarkExtMigrate`) never moves, and the baseline is one baseline that
#     grows.
#
# ==DECISION D-mde-2 — WHY `ported/ssg-md-ext` IS AN HONEST NAME==
#
# It names the DESTINATION (`ssg-md`) and which half of it (`-ext`); it does not claim a module ssg
# does not have. `src_managed/` is gitignored on every port, so the tree is a build product either
# way, and the two trees are DISJOINT BY PACKAGE — the base emits `ssg.md.{ast,parser,html,
# formatter,util}` and this emits `ssg.md.ext.*` — so ssg-md's build overlays them exactly as it
# already overlays `src_managed/main/scala` and `src/`. The alternative is a name that promises a
# module and delivers a source directory.
#
# ==DECISION D-mde-3 — WHAT MILESTONE 2 INHERITS, AND WHAT IT MUST NOT RESTATE==
#
# `base = "main.conf"` (CLAUDE.md §1.5). `packageRenames`, `governs` and both surface phases arrive
# from the base as ONE instance, so there is no `surfaceFold` to perform and no `SurfaceDivergence`
# to risk: the effective surfaces agree by construction, which is the answer §1.5 gives when the
# question is "does any dependent CONSTRUCT this phase?" and the answer is no. Everything under
# `input`, `output`, `provenance` and `runtimeMode` is a fact about THIS module's build and is
# deliberately its own.
#
# Paths are relative to THIS FILE, like `main.conf`'s and `test.conf`'s.
# -------------------------------------------------------------------------------------------

label = "ssg-md-ext"
base  = "main.conf"

input {
  # `main.conf` D-md-1's root, for D-md-1's reason: flexmark is 53 maven modules all declaring under
  # one package root, so no single directory is both a package root and a scope boundary, and the
  # root is the checkout with `includeGlobs` stating the scope.
  #
  # `PortRun.converted` reads the run's own INPUT LIST (`FrontendConfig.files`) rather than a path
  # prefix (CLAUDE.md §4.56), so ownership here is exactly the glob below — which is what makes a
  # nested source root and resolution root expressible at all.
  sourceRoot = "../../../../../ssg/original-src/flexmark-java"

  # DECISION D-mde-4 — THE FIRST EXTENSION IS `flexmark-ext-aside`, AND THE CHOICE IS ARGUED.
  #
  # Milestone 2 is 29 modules and this is the one that establishes the pattern, so it is picked for
  # what it PROVES rather than for what it ports:
  #
  #   * SMALL — 10 java files, 8 of them declaring a type (two `package-info.java`, dropped by the
  #     loader's default). The smallest scope that still has the shape;
  #   * THE CANONICAL EXTENSION SHAPE, entire. `AsideExtension` (the `Parser.ParserExtension` +
  #     `HtmlRenderer.HtmlRendererExtension` + `Formatter.FormatterExtension` registration triple),
  #     `AsideBlockParser` (+ its `BlockParserFactory` and `CustomBlockParserFactory`),
  #     `AsideNodeRenderer` (+ `NodeRendererFactory`), `AsideNodeFormatter` (+ `NodeFormatterFactory`),
  #     `AsideOptions`, the `AsideBlock` AST node and the `AsideVisitor`/`AsideVisitorExt` pair.
  #     Every other extension is a permutation of those seven, so what compiles here is what the
  #     batch waves are made of;
  #   * MILESTONE 2a — no `flexmark-ext-*` import anywhere. Verified over every `import` in the
  #     module: `com.vladsch.flexmark.{ast,formatter,html,parser}` and six `util` packages, all
  #     twelve of them the base's, plus `java.util` and the annotations jar;
  #   * NO `*JiraRenderer`. Eight extensions ship one, and `flexmark-jira-converter` is out of scope
  #     for this milestone AND one of the reference hand port's 28 undocumented omissions — a scope
  #     question the batch waves have to answer and the first extension should not be answering;
  #   * A FREE-STANDING PLAIN `@Test`. `AsideParserTest` imports `Parser`, `BasedSequence` and
  #     `SpecialLeadInHandler` and nothing else — so `ext-test.conf` can run behaviour against the
  #     BASE's main source set alone, without dragging `flexmark-test-util` (which lives in
  #     `test.conf`'s source set) into a third base chain on the wave that is establishing the
  #     pattern. Its other three test files are `ComboSpecTestCase` subclasses — the documented
  #     `@RunWith(Parameterized.class)` refusal (`PROGRESS.md` §10.6.1) — and are not in scope.
  #
  # ENUMERATED per module, never `flexmark-ext-*/src/main/java/**.java`, for `main.conf` D-md-2's
  # reason: a glob would silently admit the three modules with no coverage in the reference hand port
  # (`spec-example`, `xwiki-macros`, `zzzzzz`) and the four milestone-2b modules whose siblings have
  # to precede them, and a scope nobody can read off the file is a scope that drifts. THE DAY A
  # MODULE JOINS THIS PORT IT JOINS THIS LIST, and the diff says so — which is the whole of the
  # batch recipe (`PROGRESS.md` §10.6.8).
  # ADDED IN ASCENDING SIZE ORDER, and that is a batching rule with a reason: the smallest module
  # that still has the canonical shape surfaces an engine gap at the lowest cost per gap, and a wave
  # that stalls stalls on four files rather than on twenty-eight.
  includeGlobs = [
    "flexmark-ext-aside/src/main/java/**.java",
    "flexmark-ext-resizable-image/src/main/java/**.java",
    "flexmark-ext-youtube-embedded/src/main/java/**.java",
    "flexmark-ext-anchorlink/src/main/java/**.java",
    "flexmark-ext-escaped-character/src/main/java/**.java",
    # THE FIRST MODULE IN THIS PORT WITH A `*JiraRenderer`, and what happens to it is: it PORTS.
    # `PROGRESS.md` §10.6.8's step 1 asks the wave to say so, because eight of the 29 ship one and
    # `flexmark-jira-converter` is both out of scope and one of the reference hand port's 28
    # undocumented omissions. The question that matters is which of the two shapes a module has, and
    # it is answered by the IMPORTS rather than by the file name: `InsJiraRenderer` imports
    # `com.vladsch.flexmark.{html,util.data}` and nothing else — no `com.vladsch.flexmark.jira`, no
    # coordinate — so it is an ordinary `NodeRenderer` that this port converts with the rest of the
    # module, and the scope question the converter module raises is not raised here.
    "flexmark-ext-ins/src/main/java/**.java",
    "flexmark-ext-superscript/src/main/java/**.java",
  ]

  # DECISION D-mde-5 — THE RESOLUTION ROOTS ARE THE BASE'S TWELVE, ENUMERATED.
  #
  # `test.conf` D-mdt-2's list verbatim and for its reasons: it is the same set of modules, a glob
  # would admit `flexmark-util-experimental`, and — since D-mde-1's source root is the checkout that
  # CONTAINS these — this enumeration is also the statement of what this run resolves against rather
  # than converts. Nothing here overlaps `includeGlobs` above: no `flexmark-ext-*` module is a
  # `src/main/java` of one of the twelve.
  #
  # This is §1.5's own sentence in config: an extension resolves against the base module's JAVA,
  # never against the Scala that port emitted.
  resolutionRoots = [
    "../../../../../ssg/original-src/flexmark-java/flexmark/src/main/java",
    "../../../../../ssg/original-src/flexmark-java/flexmark-util-ast/src/main/java",
    "../../../../../ssg/original-src/flexmark-java/flexmark-util-builder/src/main/java",
    "../../../../../ssg/original-src/flexmark-java/flexmark-util-collection/src/main/java",
    "../../../../../ssg/original-src/flexmark-java/flexmark-util-data/src/main/java",
    "../../../../../ssg/original-src/flexmark-java/flexmark-util-dependency/src/main/java",
    "../../../../../ssg/original-src/flexmark-java/flexmark-util-format/src/main/java",
    "../../../../../ssg/original-src/flexmark-java/flexmark-util-html/src/main/java",
    "../../../../../ssg/original-src/flexmark-java/flexmark-util-misc/src/main/java",
    "../../../../../ssg/original-src/flexmark-java/flexmark-util-options/src/main/java",
    "../../../../../ssg/original-src/flexmark-java/flexmark-util-sequence/src/main/java",
    "../../../../../ssg/original-src/flexmark-java/flexmark-util-visitor/src/main/java",
  ]

  # `main.conf` D-md-3's one jar. Every `flexmark-ext-*` pom inherits the same compile-scope
  # `org.jetbrains:annotations`, and the extension sources import `@NotNull`/`@Nullable` exactly as
  # the base's do — an annotation SPOON cannot resolve does not fail, it resolves WRONGLY
  # (CLAUDE.md §5.1). Written by `FlexmarkClasspath`, shared with the base rather than re-resolved,
  # so the two halves of one module cannot be modelled against two different jars.
  classpathFile = "../../../../out/flexmark-classpath.txt"
}

output {
  # D-mde-2. NOT `ported/ssg-md`: that port root's two emission slots are taken, and a third run
  # there would delete one of them (D-mde-1).
  portRoot  = "../../../../ported/ssg-md-ext"
  sourceSet = "main"
}

manifest {
  # `label` and `manifest.name` take the same value (CLAUDE.md §2.1) — `label` is what `PortRun`
  # writes as `module=` into this port's own published map, and `name` is what anything declaring
  # THIS as a base would match. Everything else the manifest needs — `governs`, `packageRenames` and
  # both surface phases — arrives from `base` and is deliberately not restated (D-mde-3).
  #
  # NO `dropTypes`, `dropMethods` or `inject`: this module declares nothing about the base's surface,
  # which is what keeps `SurfaceIntrusion` silent for the right reason rather than by luck.
  name = "ssg-md-ext"
}

# BSD-2-Clause, `main.conf` D-md-6's decision restated because `provenance` is a fact about THIS
# module's build and is NOT inherited (CLAUDE.md §1.5). flexmark-java carries zero per-file licence
# headers, so the emitted banner naming the licence is a POINTER and the notice itself has to be
# shipped; this port is a derived work of the same original and ships the same bytes to its own
# `src_managed/`, so running it alone in a fresh checkout is compliant on its own.
provenance {
  upstreamName     = "flexmark-java"
  originalLicense  = "BSD-2-Clause"
  # D-md-6's prefix verbatim: D-mde-1's root is the same checkout, so a relativised origin already
  # reads `flexmark-ext-aside/src/main/java/com/vladsch/…` and one segment restores the checkout
  # directory.
  sourcePathPrefix = "flexmark-java"
  notices = [
    "../../../../../ssg/original-src/flexmark-java/LICENSE.txt",
  ]
}

# NOT `vendored`, unlike the base. `main.conf` is `RuntimeMode.Vendored` and its support types live
# in `ported/ssg-md/src_managed/main/scala`, which this source set is compiled beside; vendoring
# again would define every support type twice — tolerated by the JVM only while the copies agree and
# rejected outright by the Scala.js and Native linkers. It is also §1's rule: only a BASE can ship a
# support type, because a dependent inheriting a `RequiresRuntime` phase through `surface` cannot
# vendor one without defining all of its base's shims a second time.
runtimeMode = "dependency"

nextStep = "just md-ext-measure"
