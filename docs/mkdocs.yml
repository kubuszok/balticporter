site_name: "Baltic Porter documentation"
repo_url: https://github.com/kubuszok/balticporter
edit_uri: edit/master/docs/user-guide/
docs_dir: "user-guide"
strict: true
theme:
  name: material
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

  features:
    - content.action.edit
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.tooltips
    - navigation.expand
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.sections
    - navigation.tracking
    - search.highlight
    - search.suggest

  font:
    code: Fira Code
  icon:
    repo: fontawesome/brands/github

nav:
  - "Welcome": "index.md"
  - "Getting started": "getting-started.md"
  - "Java semantics Scala does not share": "java-semantics.md"

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      clickable_checkbox: true
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true

plugins:
  - macros
  - search

copyright: |
  <div style="color: var(--md-footer-fg-color--lighter)">
  Copyright &copy; 2026, <a href="https://kubuszok.com" target="_blank" rel="noopener">Kubuszok.com</a>.<br />
  Baltic Porter is FOSS licensed under Apache 2.0<br />
  <br />
  Documentation made with <a href="https://www.mkdocs.org" target="_blank" rel="noopener">MkDocs</a>, <a href="https://squidfunk.github.io/mkdocs-material/" target="_blank" rel="noopener">Material for MkDocs</a> and <a href="https://mkdocs-macros-plugin.readthedocs.io/" target="_blank" rel="noopener">Mkdocs-Macros</a>, hosted on <a href="https://readthedocs.org/" target="_blank" rel="noopener">Read the Docs</a>
  </div>

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kubuszok/balticporter
  scala:
    3: "3.8.4"
  local:
    commit: !ENV [CI_COMMIT, "commit"]
