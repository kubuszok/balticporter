name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "22.0.2"
  JAVA_DISTRIBUTION: "zulu"

jobs:
  # ─── Scalafmt check ────────────────────────────────────────────────

  format:
    name: Scalafmt check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: sbt

      - uses: sbt/setup-sbt@v1

      # sbt 2's launcher defaults to a thin client that starts a background server, which keeps the
      # environment of the step that started it. `--server` runs sbt in the foreground, one JVM per
      # call; the wrapper adds it to every sbt call of the job.
      - name: Make `sbt` run in the foreground
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/sbt-foreground"
          mkdir -p "$dir"
          printf '#!/usr/bin/env bash\nexec "%s" --server "$@"\n' "$(command -v sbt)" > "$dir/sbt"
          chmod +x "$dir/sbt"
          echo "$dir" >> "$GITHUB_PATH"

      - name: Check formatting
        run: sbt "scalafmtCheckAll; scalafmtSbtCheck"

  # ─── Tests ─────────────────────────────────────────────────────────

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: sbt

      - uses: sbt/setup-sbt@v1

      # sbt 2's launcher defaults to a thin client that starts a background server, which keeps the
      # environment of the step that started it. `--server` runs sbt in the foreground, one JVM per
      # call; the wrapper adds it to every sbt call of the job.
      - name: Make `sbt` run in the foreground
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/sbt-foreground"
          mkdir -p "$dir"
          printf '#!/usr/bin/env bash\nexec "%s" --server "$@"\n' "$(command -v sbt)" > "$dir/sbt"
          chmod +x "$dir/sbt"
          echo "$dir" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compile and test
        run: sbt testFull
