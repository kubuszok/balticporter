name: Sonatype Release

on:
  push:
    branches: [master]
    tags: ["*"]

env:
  JVM_VERSION: "zulu:22.0.2"

jobs:
  build-and-publish:
    # Never publish from pull requests (no secrets, and would otherwise attempt a snapshot deploy).
    # Snapshots publish on master pushes; full releases (sonaRelease) only on tag pushes — the
    # tag/snapshot distinction is made inside the `ci-release` command (`+publishSigned` on every
    # run, followed by `sonaRelease` on a tag).  checkNoSnapshotDeps (sbt-kubuszok) guards a tagged release
    # against depending on any -SNAPSHOT module.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest

    name: ${{ startsWith(github.ref, 'refs/tags/') && 'Publish Tag as Release' || 'Publish Snapshot' }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: coursier/cache-action@v9
      - name: Import GPG key for signing the release
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - uses: coursier/setup-action@v3.1.0
        with:
          jvm: ${{ env.JVM_VERSION }}
          apps: sbt
      # sbt 2's launcher defaults to a thin client that starts a background server, which keeps the
      # environment of the step that started it. `--server` runs sbt in the foreground, one JVM per
      # call; the wrapper adds it to every sbt call of the job.
      - name: Make `sbt` run in the foreground
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/sbt-foreground"
          mkdir -p "$dir"
          printf '#!/usr/bin/env bash\nexec "%s" --server "$@"\n' "$(command -v sbt)" > "$dir/sbt"
          chmod +x "$dir/sbt"
          echo "$dir" >> "$GITHUB_PATH"
      # the frontend-ts jar carries the TypeScript exporter bundle, built with npm at packaging time
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Publish all projects
        run: sbt ci-release
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
